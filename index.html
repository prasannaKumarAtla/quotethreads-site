<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Quotes&amp;Threads</title>
  <meta name="description" content="Quotes&amp;Threads: keep the quotes from the books you read, and reflect on them. Local-first Android app.">
  <style>
    :root { --bg:#faf8f5; --text:#231f26; --muted:#5f5966; --accent:#6b4fa0; --border:#e6e1ea; }
    @media (prefers-color-scheme: dark) {
      :root { --bg:#1e1a22; --text:#ece8f0; --muted:#b0a9b8; --accent:#c3a9f0; --border:#3a3441; }
    }
    * { box-sizing: border-box; }
    body { margin:0; background:var(--bg); color:var(--text); font-family:Georgia,"Palatino Linotype",serif; line-height:1.65; font-size:17px; }
    .wrap { max-width:640px; margin:0 auto; padding:48px 16px 64px; }
    .brand { font-family:system-ui,sans-serif; font-weight:700; letter-spacing:.04em; color:var(--accent); text-transform:uppercase; font-size:.95rem; }
    h1 { font-size:2.2rem; line-height:1.2; margin:8px 0 12px; }
    p { color:var(--text); }
    ul.links { list-style:none; padding:0; margin:28px 0; font-family:system-ui,sans-serif; }
    ul.links li { border-top:1px solid var(--border); }
    ul.links li:last-child { border-bottom:1px solid var(--border); }
    ul.links a { display:block; padding:14px 2px; color:var(--accent); text-decoration:none; font-weight:600; }
    ul.links a:hover, ul.links a:focus { text-decoration:underline; }
    .muted { color:var(--muted); font-family:system-ui,sans-serif; font-size:.9rem; }
  </style>
</head>
<body>
  <div class="wrap">
    <div class="brand">Quotes&amp;Threads</div>
    <h1>Remember what you read.</h1>
    <p>Quotes&amp;Threads is a quiet Android app for keeping the quotes that matter to you and reflecting on them. Your library, quotes and reflections stay on your phone. No accounts, no ads, no analytics.</p>
    <ul class="links">
      <li><a href="privacy.html">Privacy Policy</a></li>
    </ul>
    <p class="muted">Contact: <a href="mailto:prasannakumar.atla@gmail.com">prasannakumar.atla@gmail.com</a></p>
  </div>
</body>
</html>
